kind = "web"
previewPath = "/"
title = "AstroHealth Guardian"
description = "AstroHealth Guardian is an educational astronaut-health and spacecraft simulator with interactive anatomy, animated organ illustrations, system alerts and a personal wellbeing garden."
version = "1.0.0"
id = "artifacts/orbita"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22619

[services.development]
run = "pnpm --filter @workspace/orbita run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orbita", "run", "build" ]
serve = "static"
publicDir = "artifacts/orbita/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22619"
BASE_PATH = "/"
