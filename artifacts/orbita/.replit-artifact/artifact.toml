kind = "web"
previewPath = "/"
title = "ORBITA · Health & Mission"
description = "Interactive educational spaceflight simulator for astronaut health, spacecraft systems, alerts and wellbeing through a personal garden and daily journals."
version = "1.0.0"
id = "artifacts/orbita"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22619

[services.development]
run = "pnpm --filter @workspace/orbita run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/orbita", "run", "build" ]
serve = "static"
publicDir = "artifacts/orbita/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22619"
BASE_PATH = "/"
